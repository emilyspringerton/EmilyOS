name: EmilyOS CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: emilyos-${{ github.ref }}
  cancel-in-progress: true

# contents: write -- needed by the release job below (creating a git tag + a GitHub Release),
# same real convention PARENA/.github/workflows/ci.yml's own release job already established.
# test_build_construct scopes itself back down to contents: read explicitly, since it only ever
# reads.
permissions:
  contents: write

jobs:
  test_build_construct:
    name: 🏛️ Test, Build & Construct
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      GOWORK: "off"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go Tests
        shell: bash
        run: |
          set -euo pipefail
          GOWORK=off go test ./...

      # Real, confirmed-live CI break (2026-08-28): CGO_ENABLED=0 here predates
      # internal/fsaclmod (EmilyOS's second real PARENA-authored mod, GRANT_FS/REVOKE_FS,
      # commit eb6b867) -- fsaclmod is a real cgo package (`import "C"`, links the
      # PARENA-compiled fsacl mod directly), so under CGO_ENABLED=0 its own build
      # constraints exclude every file in the package ("build constraints exclude all Go
      # files in .../internal/fsaclmod"), and the build fails outright. `go test ./...`
      # (the step just above, no CGO_ENABLED override) never caught this since it runs
      # with cgo enabled by default.
      #
      # Fixed by enabling cgo here too, same real precedent PITVIPER's own CI already
      # sets for its own cgo-based PARENA mod integration (CGO_ENABLED=1, no attempt at a
      # genuinely static libc-free binary -- see that repo's own ci.yml comment on why:
      # dynamically linking against the target's own libc is the real, accepted tradeoff,
      # not a gap). EmilyOS's own CLAUDE.md already scopes this repo as "the policy kernel
      # that runs ON Linux (Ubuntu 22.04 LTS or Debian 12 baseline)," not a from-scratch,
      # dependency-free bootable image -- a dynamic libc dependency is guaranteed present
      # on any real target this binary actually runs on, so "(static)" in this step's own
      # name was already a stronger promise than the real deployment target needed; renamed
      # to drop that now-inaccurate claim rather than leave it misleading.
      - name: Build emilyos binary
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "0.1.0-ci")
          GOWORK=off CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build \
            -trimpath \
            -ldflags="-s -w -X main.Version=${VERSION}" \
            -o dist/emilyos \
            ./cmd/emilyos
          echo "Built: $(./dist/emilyos --version 2>&1 || true)"

      - name: Generate Construct Bundle
        shell: bash
        run: |
          set -euo pipefail
          OUT="EMILYOS_CONSTRUCT.txt"
          {
            echo "EMILYOS CONSTRUCT ${{ github.run_number }}"
            echo "commit: $GITHUB_SHA"
            echo "generated_utc: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo
          } > "$OUT"

          while IFS= read -r relpath; do
            {
              echo "--- FILE START: ${relpath} ---"
              cat "${relpath}"
              echo
              echo "--- FILE END: ${relpath} ---"
              echo
            } >> "$OUT"
          done < <(
            find . \
              \( \
                -path './.git' \
                -o -path './vendor' \
                -o -path './dist' \
                -o -path './build' \
                -o -path './artifacts' \
                -o -path './var' \
                -o -path './tmp' \
              \) -prune -o \
              -type f \
              \( \
                -name '*.go' -o -name '*.mod' -o -name '*.sum' -o \
                -name '*.md' -o -name '*.txt' -o -name '*.sh' -o \
                -name '*.yaml' -o -name '*.yml' -o -name '*.toml' -o \
                -name 'Makefile' -o -name 'Dockerfile' -o -name '.gitignore' \
              \) \
              ! -name "$OUT" \
              -print | sed 's#^./##' | LC_ALL=C sort
          )

          test -s "$OUT"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emilyos-${{ github.run_number }}-${{ github.sha }}
          path: |
            dist/emilyos
            EMILYOS_CONSTRUCT.txt
          if-no-files-found: error

  # Founder real-time, 2026-09-08: "do we have artifacts publishing and auto releasing the same
  # way as parena repo?" -> "yea". Same real pattern PARENA's own ci.yml release job already
  # established: gated to push-to-main only (not PRs, not tags, not workflow_dispatch — a real
  # release per green main build, not a flood), auto-bumps a v{major}.{minor+1}.0 tag off the
  # latest existing tag, and publishes a real, persistent GitHub Release (regular, not
  # --prerelease, matching PARENA's own 2026-08-26 "move to regular releases" call — EmilyOS has
  # no earlier "pre-release for now" period to honor, so there's no reason to start there). Only
  # one real platform/artifact here (a single Linux amd64 binary, matching this repo's own
  # CLAUDE.md scoping — "the policy kernel that runs ON Linux... not a from-scratch,
  # dependency-free bootable image"), unlike PARENA's real three-platform editor-demo bundles —
  # no cross-compiled Windows/macOS story exists for this binary, so none is invented here.
  release:
    name: Tag & Release
    runs-on: ubuntu-latest
    needs: [test_build_construct]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 -- this job needs the full tag history to find the current version;
      # actions/checkout's own default is a shallow clone that doesn't reliably include tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Downloaded into 'artifact/', not 'dist/' -- upload-artifact@v4 preserves each uploaded
      # path's own directory structure relative to the least common ancestor of everything it was
      # given (dist/emilyos and top-level EMILYOS_CONSTRUCT.txt -> LCA is the repo root), so the
      # downloaded content lands as artifact/dist/emilyos + artifact/EMILYOS_CONSTRUCT.txt, not
      # flattened. Naming the download target 'dist' too would produce a confusing dist/dist/
      # nesting -- named distinctly instead of fighting that.
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: emilyos-${{ github.run_number }}-${{ github.sha }}
          path: artifact

      - name: Package release asset
        run: |
          set -euo pipefail
          mkdir -p release-stage
          cp artifact/dist/emilyos release-stage/
          cp artifact/EMILYOS_CONSTRUCT.txt release-stage/
          chmod +x release-stage/emilyos
          tar -czf emilyos-linux-amd64.tar.gz -C release-stage emilyos EMILYOS_CONSTRUCT.txt

      - name: Compute next minor version
        id: version
        run: |
          set -euo pipefail
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          if [ -z "$latest" ]; then
            major=0
            minor=0
          else
            ver="${latest#v}"
            major="$(echo "$ver" | cut -d. -f1)"
            minor="$(echo "$ver" | cut -d. -f2)"
          fi
          next_minor=$((minor + 1))
          next="v${major}.${next_minor}.0"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          git tag "$NEXT_VERSION"
          git push origin "$NEXT_VERSION"
          gh release create "$NEXT_VERSION" \
            emilyos-linux-amd64.tar.gz \
            --title "$NEXT_VERSION" \
            --generate-notes
